<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Arial, sans-serif" font-size="13">
  <rect width="640" height="440" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold">Time complexity: execution time vs input size</text>

  <!-- Axes -->
  <line x1="70" y1="370" x2="570" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="370" x2="70" y2="40" stroke="#333" stroke-width="2"/>

  <!-- X axis ticks and labels -->
  <g stroke="#333">
    <line x1="70" y1="370" x2="70" y2="375"/>
    <line x1="170" y1="370" x2="170" y2="375"/>
    <line x1="270" y1="370" x2="270" y2="375"/>
    <line x1="370" y1="370" x2="370" y2="375"/>
    <line x1="470" y1="370" x2="470" y2="375"/>
    <line x1="570" y1="370" x2="570" y2="375"/>
  </g>
  <text x="70" y="390" text-anchor="middle">0</text>
  <text x="170" y="390" text-anchor="middle">20</text>
  <text x="270" y="390" text-anchor="middle">40</text>
  <text x="370" y="390" text-anchor="middle">60</text>
  <text x="470" y="390" text-anchor="middle">80</text>
  <text x="570" y="390" text-anchor="middle">100</text>
  <text x="320" y="415" text-anchor="middle" font-size="14">Input size (n)</text>

  <!-- Y axis label (no tick values, since only the shape matters) -->
  <text x="22" y="205" text-anchor="middle" font-size="14" transform="rotate(-90 22 205)">Execution time</text>

  <!-- Functions are clipped to the plot area so curves leaving the top are cut off -->
  <defs>
    <clipPath id="plot">
      <rect x="70" y="40" width="500" height="330"/>
    </clipPath>
  </defs>
  <g clip-path="url(#plot)">
  <!-- O(1): constant -->
  <polyline fill="none" stroke="#2e7d32" stroke-width="3" points="70,320 570,320"/>
  <!-- O(log n) -->
  <polyline fill="none" stroke="#1565c0" stroke-width="3" points="70,370 80,338.3 90,323.6 100,313.9 110,306.6 120,300.8 130,296 140,291.9 150,288.3 160,285 170,282.2 180,279.5 190,277.1 200,274.9 210,272.8 220,270.9 230,269.1 240,267.4 250,265.8 260,264.3 270,262.8 280,261.5 290,260.2 300,258.9 310,257.7 320,256.6 330,255.4 340,254.4 350,253.3 360,252.3 370,251.4 380,250.5 390,249.6 400,248.7 410,247.8 420,247 430,246.2 440,245.4 450,244.7 460,243.9 470,243.2 480,242.5 490,241.8 500,241.1 510,240.5 520,239.8 530,239.2 540,238.6 550,238 560,237.4 570,236.8"/>
  <!-- O(n) -->
  <polyline fill="none" stroke="#f9a825" stroke-width="3" points="70,370 80,364 90,358 100,352 110,346 120,340 130,334 140,328 150,322 160,316 170,310 180,304 190,298 200,292 210,286 220,280 230,274 240,268 250,262 260,256 270,250 280,244 290,238 300,232 310,226 320,220 330,214 340,208 350,202 360,196 370,190 380,184 390,178 400,172 410,166 420,160 430,154 440,148 450,142 460,136 470,130 480,124 490,118 500,112 510,106 520,100 530,94 540,88 550,82 560,76 570,70"/>
  <!-- O(n²) -->
  <polyline fill="none" stroke="#c62828" stroke-width="3"   points="70,370 80,368.8 90,365.2 100,359.2 110,350.8 120,340 130,326.8 140,311.2 150,293.2 160,272.8 170,250 180,224.8 190,197.2 200,167.2 210,134.8 220,100 230,62.8 240,23.2 250,-18.8 260,-63.2 270,-110 280,-159.2 290,-210.8 300,-264.8 310,-321.2 320,-380 330,-441.2 340,-504.8 350,-570.8 360,-639.2 370,-710 380,-783.2 390,-858.8 400,-936.8 410,-1017.2 420,-1100 430,-1185.2 440,-1272.8 450,-1362.8 460,-1455.2 470,-1550 480,-1647.2 490,-1746.8 500,-1848.8 510,-1953.2 520,-2060 530,-2169.2 540,-2280.8 550,-2394.8 560,-2511.2 570,-2630"/>
    </g>

    <!-- Legend -->
  <rect x="88" y="50" width="170" height="92" fill="#ffffff" stroke="#999"/>
  <line x1="100" y1="68" x2="130" y2="68" stroke="#2e7d32" stroke-width="3"/>
  <text x="140" y="72">O(1) constant</text>
  <line x1="100" y1="88" x2="130" y2="88" stroke="#1565c0" stroke-width="3"/>
  <text x="140" y="92">O(log n) logarithmic</text>
  <line x1="100" y1="108" x2="130" y2="108" stroke="#f9a825" stroke-width="3"/>
  <text x="140" y="112">O(n) linear</text>
  <line x1="100" y1="128" x2="130" y2="128" stroke="#c62828" stroke-width="3"/>
  <text x="140" y="132">O(n²) quadratic</text>
</svg>
